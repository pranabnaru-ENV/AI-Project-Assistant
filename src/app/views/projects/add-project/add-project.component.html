
<c-row>
  <c-col xs="12" lg="12">
    <c-card class="mb-4">
      <c-card-header>
        <strong>Add New Project</strong>
      </c-card-header>
      <c-card-body>
        <div class="p-4 bg-light border rounded">
        <form cForm>
          
          <div class="mb-3">
            <label cLabel for="projectName">Project Name</label>
            <input cFormControl id="projectName" placeholder="e.g., Project Alpha" type="text" />
          </div>

          <div class="mb-3">
            <label cLabel for="location">Location (Country)</label>
            <select cSelect id="location">
              <option value="">Select a country...</option>
              <option value="US">United States</option>
              <option value="IN">India</option>
              <option value="BR">Brazil</option>
              <option value="FR">France</option>
            </select>
          </div>

          <div class="mb-3">
            <label cLabel for="status">Project Status</label>
            <select cSelect id="status">
              <option value="New">New</option>
              <option value="Recurring">Recurring</option>
              <option value="Sleep">Sleep</option>
            </select>
          </div>

          <div class="mb-4">
            <label cLabel for="usage">Usage / Completion (%)</label>
            <input cFormControl id="usage" type="number" min="0" max="100" placeholder="0" />
          </div>

          <div class="mb-3">
              <label cLabel for="exampleFormControlInput1">Email address</label>
              <input cFormControl
                     id="exampleFormControlInput1"
                     placeholder="name@example.com"
                     type="email"
              />
            </div>
            <div class="mb-3">
              <label cLabel for="exampleFormControlTextarea1">Example textarea</label>
              <textarea cFormControl id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>

          <div class="d-flex justify-content-end mt-4">
            <!-- The Cancel button routes back to the main Projects page -->
            <a cButton color="secondary" variant="ghost" class="me-2" routerLink="/projects">
              Cancel
            </a>
            <button cButton color="primary" type="button">
              Save Project
            </button>
          </div>

        </form>
        </div>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
